<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
    <link rel="stylesheet" href="/form/css/style.css">
</head>
<body>
    <header class="site-header">
        <div>
            <h2 class="title-header">
            Formulário simples
            </h2>
            <span id="registered-count">
                0  cadastrados
            </span>
        </div>
    </header>

    <main>

        <div id="messageBox"></div>

        <nav>
            <div>
                <h2>Novo Cadastro</h2>
                <img src="" alt="icon-new-user">
            </div>
            
            <form>
                <div>
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" placeholder="Ex: Caio Silva">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Ex: caio@email.com">
                </div>

                <button>
                    <img src="" alt="icon-add">
                    Cadastrar Pessoa
                </button>
            </form>
        </nav>

        <div>
            <div>
                <h3>Lista de Cadastrados</h3>
                <img src="" alt="icon-list">
                <button>
                    Limpar lista
                </button>
            </div>

            <section id="listContent">
                Nenhum cadastro realizado
            </section>
        </div>
    </main>
</body>
<script src="/form/js/script.js"></script>
</html>
