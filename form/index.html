<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
    <link rel="stylesheet" href="/form/css/style.css">
</head>
<body>
    <header class="site-header">
        <div id="div-header">
            <h2 class="title-header">
            Formulário simples
            </h2>
            <span id="registered-count">
                0  cadastrados
            </span>
        </div>
    </header>

    <main>

        <div id="messageBox"></div>

        <nav>
            <div class="div-title-nav">
                <img src="/form/assets/img/adicionar-usuario.png" alt="icon-new-user" >
                <h2>Novo Cadastro</h2>
            </div>
            
            <form>
                <div class="form-div">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" placeholder="Ex: Caio Silva">
                </div>
 
                <div class="form-div">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Ex: caio@email.com">
                </div>

                <button onclick="handleFormSubmit()">
                    <img src="/form/assets/img/mais.png" alt="icon-add" style="height: 10px;">
                    Cadastrar Pessoa
                </button>
            </form>
        </nav>

        <div class="list-users">

            <div>
                <div class="title-list">
                    <img src="/form/assets/img/pesssoas.png" alt="icon-list" height="20px">
                    <h3>Lista de Cadastrados</h3>
                </div>
                
                <button class="clear-button">
                    Limpar lista
                </button>
            </div>

            
            <section id="listContent">
                Nenhum cadastro realizado
            </section>

        </div>
    </main>
</body>
<script src="/form/js/script.js"></script>
</html>
